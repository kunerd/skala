[package]
name = "skala"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = {version = "0.15.0-dev", features = ["tokio"]}
rfd = { version = "0.17.2", features = ["xdg-portal"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["fs"] }

[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
